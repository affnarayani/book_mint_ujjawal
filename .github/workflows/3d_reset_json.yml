name: 3D. Reset JSON

on: 
  workflow_dispatch: 
  workflow_run:
    workflows: ["3C. Gumroad Upload"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-reset-json-automation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN_ALL }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull --rebase

    - name: Run Reset JSON Script
      run: |
        python reset_json.py

    - name: Commit and Push Cleaned/Reset Files
      run: |
        # Reset script dwara updated, moved, aur modified saare changes track karein
        git add ebook_status.json ebook_ideas.json

        if [ -d "ebook" ] && [ "$(ls -A ebook)" ]; then
          git add ebook/
        fi
        
        if [ -d "published" ] && [ "$(ls -A published)" ]; then
          git add published/
        fi
        
        if git diff --staged --quiet; then
          echo "[INFO] No changes detected after reset. Skipping push."
        else
          echo "[OK] Changes detected. Committing and pushing updates..."
          git commit -m "Automated: Move published ebook files and reset status/ideas JSON [skip ci]"
          
          # Conflict hone par workflow wali latest file ko preference di jayegi (-X theirs)
          git pull origin ${GITHUB_REF_NAME} --rebase -X theirs || git rebase --skip
          
          git push origin ${GITHUB_REF_NAME}
        fi