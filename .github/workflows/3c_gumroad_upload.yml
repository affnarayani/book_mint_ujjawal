name: 3C. Gumroad Upload

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["3B. KDP Upload"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-gumroad-upload-automation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN_ALL }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        # 1. Add repository and GPG key
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        
        # 2. Install
        sudo apt-get update && sudo apt-get install -y cloudflare-warp
        
        # 3. Start service
        sudo systemctl start warp-svc
        sleep 2
        
        # 4. Register (new CLI syntax compatible)
        warp-cli --accept-tos registration new || warp-cli registration new
        
        # 5. Switch mode from PROXY to TUN (standard VPN)
        warp-cli --accept-tos mode warp || warp-cli mode warp
        
        # 6. Connect
        warp-cli --accept-tos connect || warp-cli connect
        sleep 5
        
        # 7. Verify system IP
        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Gumroad Upload Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python gumroad_upload.py

    - name: Upload Error Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-gumroad-error
        path: error/error_screenshot.png
        if-no-files-found: ignore

    - name: Commit and Push Status Updates
      run: |
        # Track pipeline status updates, locator files & config
        git add json/ebook_status.json
        git add locators/ json/config.json
        
        if git diff --staged --quiet; then
          echo "[INFO] No changes detected in status. Skipping push."
        else
          echo "[OK] Changes detected. Committing and pushing updates..."
          git commit -m "Automated: Update Gumroad upload status [skip ci]"
          
          # On conflict, prefer the workflow's latest file (-X theirs)
          git pull origin ${GITHUB_REF_NAME} --rebase -X theirs || git rebase --skip
          
          git push origin ${GITHUB_REF_NAME}
        fi